<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLang}">
<head>
    <meta charset="UTF-8">
    <title th:text="${msg.visual.title}">Blackjack Simulation - Tick Mode</title>
    <style>
        .card-container { display: flex; gap: 10px; min-height: 120px; }
        .card-view {
            width: 80px; height: 116px;
            background-image: url('/card.png');
            background-size: 1280px 698px;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div>
        <span th:text="${msg.visual.label_dealer}">DEALER</span> (<span th:text="${msg.visual.label_score}">Score:</span> <span id="dealer-score">0</span>)
        <div id="dealer-cards" class="card-container"></div>
    </div>

    <br>

    <div>
        <span th:text="${msg.visual.label_player}">PLAYER</span> (<span th:text="${msg.visual.label_score}">Score:</span> <span id="player-score">0</span>)
        <div id="player-cards" class="card-container"></div>
    </div>

    <hr>

    <h3 th:text="${msg.visual.header_simulation}">Simulation</h3>
    <p>
        <span th:text="${msg.visual.label_capital}">Capital: $</span><span id="current-money">0</span><br>
        <span th:text="${msg.visual.label_progress}">Progress:</span> <span id="game-progress">0 / 0</span><br>
        <span th:text="${msg.visual.label_action}">Action:</span> <span id="current-action" th:text="${msg.visual.status_waiting}">WAITING</span>
    </p>

    <p>
        <span th:text="${msg.visual.stat_p_wins}">Player Wins:</span> <span id="p-wins">0</span><br>
        <span th:text="${msg.visual.stat_p_bj}">Player BJ:</span> <span id="p-bj">0</span><br>
        <span th:text="${msg.visual.stat_d_wins}">Dealer Wins:</span> <span id="d-wins">0</span><br>
        <span th:text="${msg.visual.stat_d_bj}">Dealer BJ:</span> <span id="d-bj">0</span><br>
        <span th:text="${msg.visual.stat_ties}">Ties:</span> <span id="ties">0</span>
    </p>

    <div>
        <span th:text="${msg.visual.label_speed}">Speed:</span> <span id="speed-value">10 TPS</span>
        <input type="range" id="speed-range" min="1" max="100" value="10">
        <button onclick="skipSimulation()" th:text="${msg.visual.btn_skip}">SKIP TO RESULT</button>
    </div>

    <script type="module" th:src="@{/js/app.js}"></script>
</body>
</html>
