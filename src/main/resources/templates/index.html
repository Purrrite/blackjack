<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLang}">
<head>
    <meta charset="UTF-8">
    <title th:text="${msg.index.title}">Blackjack Simulator - Setup</title>
</head>
<body>
    <div style="text-align: right;">
        <a href="?lang=en" th:style="${currentLang == 'en' ? 'font-weight: bold;' : ''}">English</a> |
        <a href="?lang=kr" th:style="${currentLang == 'kr' ? 'font-weight: bold;' : ''}">한국어</a>
    </div>

    <h1 th:text="${msg.index.header}">Blackjack Simulation</h1>
    <form id="simForm">
        <div>
            <label for="count" th:text="${msg.index.label_count}">Simulation Count (횟수):</label>
            <input type="number" id="count" name="count" value="100000" required>
        </div>
        <div>
            <label for="initialMoney" th:text="${msg.index.label_initial_money}">Initial Capital (초기 자본):</label>
            <input type="number" id="initialMoney" name="initialMoney" value="1000000" required>
        </div>
        <div>
            <label for="betAmount" th:text="${msg.index.label_bet_amount}">Bet Amount (베팅 금액):</label>
            <input type="number" id="betAmount" name="betAmount" value="100" required>
        </div>

        <div>
            <button type="button" onclick="runSimulation('/simulate')" th:text="${msg.index.btn_quick}">Quick Stats</button>
            <button type="button" onclick="runSimulation('/visual')" th:text="${msg.index.btn_visual}">Visual Tick Mode</button>
        </div>
    </form>

    <script>
        function runSimulation(endpoint) {
            const form = document.getElementById('simForm');
            const params = new URLSearchParams(new FormData(form)).toString();
            window.location.href = endpoint + '?' + params;
        }
    </script>
</body>
</html>
