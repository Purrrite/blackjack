<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blackjack Simulator - Setup</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn-container { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-quick { background-color: #3498db; }
        .btn-visual { background-color: #27ae60; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <h1>Blackjack Simulation</h1>
    <form id="simForm">
        <div class="form-group">
            <label for="count">Simulation Count (횟수):</label>
            <input type="number" id="count" name="count" value="100000" required>
        </div>
        <div class="form-group">
            <label for="initialMoney">Initial Capital (초기 자본):</label>
            <input type="number" id="initialMoney" name="initialMoney" value="1000000" required>
        </div>
        <div class="form-group">
            <label for="betAmount">Bet Amount (베팅 금액):</label>
            <input type="number" id="betAmount" name="betAmount" value="100" required>
        </div>
        
        <div class="btn-container">
            <button type="button" class="btn-quick" onclick="runSimulation('/simulate')">Quick Stats</button>
            <button type="button" class="btn-visual" onclick="runSimulation('/visual')">Visual Tick Mode</button>
        </div>
    </form>

    <script>
        function runSimulation(endpoint) {
            const form = document.getElementById('simForm');
            const params = new URLSearchParams(new FormData(form)).toString();
            window.location.href = endpoint + '?' + params;
        }
    </script>
</body>
</html>
