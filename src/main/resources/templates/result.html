<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLang}">
<head>
    <meta charset="UTF-8">
    <title th:text="${msg.result.title}">Blackjack Simulation Results</title>
</head>
<body>
    <h1 th:text="${msg.result.header}">Blackjack Simulation Results</h1>
    <p><span th:text="${msg.result.sim_count_label}">Simulation Count:</span> <strong th:text="${result.totalGames}">100,000</strong> <span th:text="${msg.result.games_unit}">games</span></p>

    <p>
        <span th:text="${msg.result.label_initial_capital}">Initial Capital</span>: <span th:text="${result.initialMoney}">1,000,000</span><br>
        <span th:text="${msg.result.label_final_capital}">Final Capital</span>: <span th:text="${result.finalMoney}">1,000,000</span><br>
        <span th:text="${msg.result.label_profit_loss}">Profit/Loss</span>: <span th:text="${result.finalMoney - result.initialMoney}">0</span><br>
        <span th:text="${msg.result.label_roi}">ROI (Return on Investment)</span>: <span th:text="${#numbers.formatDecimal(result.roi, 1, 2) + '%'}">0.00%</span>
    </p>

    <table>
        <thead>
            <tr>
                <th th:text="${msg.result.table_header_result}">Game Result</th>
                <th th:text="${msg.result.table_header_count}">Count</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="stat : ${result.stats}">
                <td th:text="${msg.enums[stat.key.name()]} ?: ${stat.key}">PLAYER_WIN</td>
                <td th:text="${stat.value}">0</td>
            </tr>
        </tbody>
    </table>
    <br>
    <a href="/" th:text="${msg.result.btn_back}">← Run New Simulation</a>
</body>
</html>
